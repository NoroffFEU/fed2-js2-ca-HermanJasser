<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body class="flex items-center justify-center min-h-screen bg-blue-100">
    <div class="w-full max-w-md shadow-lg rounded-lg bg-white py-6">
      <h1 class="text-2xl font-semibold text-center text-gray-700 mb-6">
        Login
      </h1>
      <form id="login" name="login" class="space-y-6">
        <div class="mx-10">
          <label for="email" class="block">Email</label>
          <input
            class="w-full border rounded-lg px-6 py-2 mt-1"
            id="email"
            type="email"
            name="email"
            required
          />
        </div>

        <div class="mx-10">
          <label for="password" class="block">Password</label>
          <input
            class="w-full border rounded-lg px-6 py-2 mt-1"
            type="password"
            name="password"
            id="password"
            required
          />
        </div>
        <div class="flex justify-between mx-10">
          <a
            class="underline hover:no-underline text-blue-500 hover:text-blue-700"
            href="/auth/register/"
            >Register</a
          >
          <button
            class="px-6 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-700"
          >
            Login
          </button>
        </div>
        <p id="alert-login"></p>
      </form>
    </div>
  </body>
</html>
