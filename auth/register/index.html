<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA</title>
    <script type="module" src="/src/app.js"></script>
  </head>

  <body class="flex items-center justify-center min-h-screen bg-blue-100">
    <div class="w-full max-w-md shadow-lg rounded-lg bg-white py-6">
    <h1 class="text-2xl font-semibold text-center text-gray-700 mb-6">Register</h1>

    <form id="register" name="register" class="space-y-6">
      <div class="mx-10">
        <label class="block" for="name">Name</label>
        <input
          class="w-full border rounded-lg px-6 py-2 mt-1"
          id="name"
          type="text"
          name="name"
          required
          maxlength="20"
          pattern="^[\w]+$"
          title="Please enter a username using only letters and numbers"
        />
      </div>

      <div class="mx-10">
        <label class="block" for="email">Email</label>
        <input
          class="w-full border rounded-lg px-6 py-2 mt-1"
          id="email"
          type="email"
          name="email"
          required
          pattern="^[\w\-.]+@(stud\.)?noroff\.no$"
          title="Please enter a valid noroff.no or stud.noroff.no address"
        />
      </div>

      <div class="mx-10">
        <label class="block" for="password">Password</label>
        <input
          class="w-full border rounded-lg px-6 py-2 mt-1"
          type="password"
          name="password"
          id="password"
          required
          minlength="8"
        />
      </div>
      <div class="flex justify-between mx-10">
        <a class="underline hover:no-underline text-blue-500 hover:text-blue-700" href="/auth/login/">Login</a>
        <button class="px-6 py-2 text-white bg-blue-500 rounded-lg hover:bg-blue-700">Register</button>
      </div>
    </form>
  </div>
  </body>
</html>
