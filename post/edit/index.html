<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA - Edit Post</title>
    <script type="module" src="/src/app.js"></script>
  </head>
  <body class="flex items-center justify-center min-h-screen bg-blue-100">
    <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-8">
      <img
        class="w-1/2 mx-auto my-6"
        src="/images/noroff-logo.png"
        alt="Noroff Logo"
      />

      <h1 class="text-4xl font-bold text-center mb-6">Edit Post</h1>

      <form id="edit-post-form" name="editPost" class="space-y-4">
        <div>
          <label for="title" class="block text-sm font-medium">Title</label>
          <input
            type="text"
            name="title"
            placeholder="Title"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="content" class="block text-sm font-medium">Content</label>
          <textarea
            name="content"
            placeholder="Content"
            cols="30"
            rows="10"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          ></textarea>
        </div>

        <div>
          <label for="url" class="block text-sm font-medium">Add image URL</label>
          <input
            type="url"
            name="url"
            placeholder="URL"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="alt" class="block text-sm font-medium">Add image alt text</label>
          <input
            type="text"
            name="alt"
            placeholder="Alt text"
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <button
          type="submit"
          class="w-full py-2 mt-4 text-white bg-blue-500 rounded-lg hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          Edit Post
        </button>
      </form>
    </div>
  </body>
</html>
